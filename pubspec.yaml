name: hitung
description: "HITUNG - Pencatat Pengeluaran Offline-First"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Database (SQLite ORM)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI & Design
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Utilities & Device APIs
  intl: ^0.20.3
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  file_picker: ^8.0.5
  local_auth: ^2.2.0
  lucide_icons_flutter: ^4.0.1
  lottie: ^3.6.1
  flutter_local_notifications: ^21.0.0
  pdf: ^3.12.0
  image_picker: ^1.2.4
  crypto: ^3.0.8
  timezone: ^0.11.2
  universal_io: ^2.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  image: 4.5.3

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/google_fonts/
    - assets/icon/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/google_fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

