name: hitung
description: "HITUNG - Pencatat Pengeluaran Offline-First"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Database (SQLite ORM)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI & Design
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Utilities & Device APIs
  intl: ^0.20.3
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  file_picker: ^8.0.5
  local_auth: ^2.2.0
  lucide_icons_flutter: ^4.0.1
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/google_fonts/
